services:
  codesearch:
    build: .
    container_name: codesearch
    restart: unless-stopped
    # Run as a non-root user. The UID must own the ./volumes/* bind mounts on
    # the host; the group must stay 0 so the Tomcat directories baked into the
    # image remain writable.
    user: "1000:0"
    environment:
      SYNC_PERIOD_MINUTES: 10
      NOMIRROR: 1
      CHECK_INDEX: 1
    volumes:
      - ./volumes/data:/data
      - ./volumes/data/src:/opengrok/src
      - ./volumes/index:/opengrok/data
      - ./volumes/config:/opengrok/etc
    ports:
      - 2015:8080
